<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens Flare Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Lens Flare Generator</h1>
    <div class="top-actions">
      <label class="btn" for="file">Ladda highlight-video</label>
      <input id="file" type="file" accept="video/*" hidden>
      <select id="preset" title="Förinställningar"></select>
      <button id="presetSave" class="btn ghost" title="Spara aktuella inställningar som egen preset">Spara preset</button>
      <button id="presetDel" class="btn ghost" title="Ta bort vald egen preset" hidden>Ta bort</button>
      <button id="jsonSave" class="btn ghost" title="Ladda ner inställningar som JSON">Exportera JSON</button>
      <label class="btn ghost" for="jsonLoad">Importera JSON</label>
      <input id="jsonLoad" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="main">
    <section class="stage-col">
      <div id="drop" class="drop">
        <strong>Släpp en highlight-video här</strong>
        <span>eller klicka för att välja fil – vita områden mot svart bakgrund</span>
      </div>
      <div id="stageWrap" class="stage-wrap" hidden>
        <div id="stage" class="stage">
          <video id="vid" muted playsinline loop preload="auto"></video>
          <canvas id="cv"></canvas>
          <div id="busy" class="busy" hidden>
            <div class="busy-box">
              <div id="busyText">Analyserar…</div>
              <progress id="busyBar" max="1" value="0"></progress>
              <button id="busyCancel" class="btn ghost">Avbryt</button>
            </div>
          </div>
        </div>
      </div>
      <div class="transport" id="transport" hidden>
        <button id="play" class="btn" title="Mellanslag">▶</button>
        <input id="scrub" type="range" min="0" max="0" value="0" step="1">
        <span id="timecode" class="mono">00:00:00</span>
      </div>
      <div id="status" class="status"></div>
    </section>

    <aside id="panel" class="panel">
      <details class="grp" open>
        <summary>Källa</summary>
        <div class="grp-body">
          <div class="row"><label>Bildfrekvens (fps)</label>
            <select id="fps"></select></div>
          <div class="row"><label title="Upplösning på analysen som väljer och följer highlights. Högre = noggrannare men mer minne.">Analysupplösning</label>
            <select id="maskRes">
              <option value="128">Låg (128 px bred)</option>
              <option value="256" selected>Normal (256 px)</option>
              <option value="384">Hög (384 px)</option>
              <option value="512">Mycket hög (512 px)</option>
            </select></div>
          <div class="row"><label>Förhandsvisning</label>
            <select id="previewScale">
              <option value="auto" selected>Auto (max 1280 px)</option>
              <option value="1">100 %</option>
              <option value="0.5">50 %</option>
              <option value="0.25">25 %</option>
            </select></div>
          <div class="row"><label>Visa highlight-video under</label>
            <input id="overlay" type="range" min="0" max="1" step="0.01" value="0.35">
            <output id="overlayOut">0.35</output></div>
          <div class="note" id="srcInfo"></div>
        </div>
      </details>
      <div id="schema"></div>
      <details class="grp" open id="exportGrp">
        <summary>Export</summary>
        <div class="grp-body">
          <div class="row"><label>Format</label>
            <select id="expFormat">
              <option value="h264">MP4 (H.264) – flare på svart</option>
              <option value="png">PNG-sekvens med alfa (.zip)</option>
              <option value="vp9">MP4 (VP9) – ej AE-vänlig</option>
            </select></div>
          <div class="row" id="rowBitrate"><label>Bitrate (Mbit/s)</label>
            <input id="expBitrate" type="number" min="1" max="400" step="1" value="40"></div>
          <div class="note" id="expNote">Flare på ren svart bakgrund. Lägg lagret i After Effects med blandningsläge <b>Add</b> eller <b>Screen</b>.</div>
          <button id="exportBtn" class="btn primary wide" disabled>Exportera</button>
          <progress id="expBar" max="1" value="0" hidden></progress>
          <button id="expCancel" class="btn ghost wide" hidden>Avbryt export</button>
          <div class="note" id="expMsg"></div>
        </div>
      </details>
    </aside>
  </main>
</div>

<script src="vendor/mp4-muxer.js"></script>
<script src="js/engine.js"></script>
<script src="js/renderer.js"></script>
<script src="js/exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
